function salvarEdicaoLancamento(lancId){
  const l = state.lancamentos.find(x=>x.id===lancId);
  if(!l) return;
  const desc = document.getElementById('editLancDesc').value.trim();
  const valor = parseMoneyInput(document.getElementById('editLancValor').value);
  const data = document.getElementById('editLancData').value;
  if(!valor || valor<=0){ showToast('Informe um valor válido'); return; }
  if(!data){ showToast('Informe uma data válida'); return; }

  // Se faz parte de uma recorrência, pergunta se a mudança de descrição/valor/
  // categoria/quem deve valer só para este mês ou também para os futuros (a data
  // e o mês de referência de cada ocorrência nunca são tocados pela propagação).
  let propagarFuturos = false;
  if(l.recorrenciaGrupo){
    propagarFuturos = confirm('Este lançamento faz parte de uma recorrência.\n\nOK = aplicar a mudança neste e em todos os lançamentos futuros da mesma recorrência.\nCancelar = aplicar só neste mês.');
  }

  const aplicarCampos = (item, isOriginal)=>{
    item.descricao = desc || item.descricao;
    item.valor = valor;
    if(isOriginal){
      item.data = data;
      item.mesRef = ymFromISO(data);
    }
    if(item.tipo==='despesa'){
      item.categoria = ui.editLancCategoria || item.categoria;
      item.quem = ui.editLancQuem || item.quem;
      item.natureza = ui.editLancNatureza || item.natureza || 'variavel';
      if(item.formaTipo==='cartao'){
        item.cartaoId = ui.editLancCartaoId || item.cartaoId || cartaoPadrao().id;
      }
      if(isOriginal && item.formaTipo){
        const boletoVenc = item.formaTipo==='boleto' ? (item.dataCaixa||data) : null;
        item.dataCaixa = calcularDataCaixa(item.formaTipo, data, item.parcela ? item.parcela.atual-1 : 0, boletoVenc, item.cartaoId);
      }
    } else {
      item.quem = ui.editLancQuem || item.quem;
    }
  };
  aplicarCampos(l, true);
  if(propagarFuturos){
    const hojeIso = todayISO();
    state.lancamentos.filter(x=> x.recorrenciaGrupo===l.recorrenciaGrupo && x.id!==l.id && x.data>=hojeIso)
      .forEach(x=>aplicarCampos(x, false));
  }
  saveState();
  closeSheet();
  showToast(propagarFuturos ? 'Lançamento e futuros atualizados ✓' : 'Lançamento atualizado ✓');
}
function excluirLancamento(lancId, grupoInteiro){
  const l = state.lancamentos.find(x=>x.id===lancId);
  if(!l) return;
  if(grupoInteiro && l.parcelaGrupo){
    if(!confirm(`Excluir todas as ${l.parcela?.total||''} parcelas deste parcelamento?`)) return;
    state.lancamentos = state.lancamentos.filter(x=>x.parcelaGrupo!==l.parcelaGrupo);
  } else {
    if(!confirm('Excluir este lançamento?')) return;
    state.lancamentos = state.lancamentos.filter(x=>x.id!==lancId);
  }
  saveState();
  closeSheet();
  showToast('Lançamento excluído ✓');
}
/* Exclui este lançamento e todas as ocorrências futuras (data >= hoje) da mesma
   recorrência — usado para "cancelar a assinatura a partir de agora". Ocorrências
   passadas (histórico) nunca são apagadas. */
function excluirLancamentoRecorrenciaFuturos(lancId){
  const l = state.lancamentos.find(x=>x.id===lancId);
  if(!l || !l.recorrenciaGrupo) return;
  const hojeIso = todayISO();
  const alvo = state.lancamentos.filter(x=> x.recorrenciaGrupo===l.recorrenciaGrupo && (x.id===l.id || x.data>=hojeIso));
  if(!confirm(`Excluir este lançamento e mais ${alvo.length-1} ocorrência(s) futura(s) desta recorrência? Lançamentos passados não serão apagados.`)) return;
  const idsAlvo = new Set(alvo.map(x=>x.id));
  state.lancamentos = state.lancamentos.filter(x=>!idsAlvo.has(x.id));
  // Marca a recorrência como encerrada (vira "período" com fim = hoje) para que o
  // boot não recrie as ocorrências futuras que acabamos de apagar.
  const semente = state.lancamentos.find(x=>x.recorrenciaGrupo===l.recorrenciaGrupo && x.recorrenciaIndice===0);
  if(semente){ semente.recorrencia = 'periodo'; semente.recorrenciaFim = hojeIso; }
  saveState();
  closeSheet();
  showToast('Recorrência encerrada a partir deste lançamento ✓');
}

/* Extrato de um pote: histórico de entradas (aportes + saldo inicial) e saídas
   (resgates), mais recentes primeiro, com o saldo do pote logo após cada evento. */
function abrirExtratoPote(poteId){
  const p = state.potes.find(x=>x.id===poteId);
  if(!p) return;
  const eventos = [{ data: p.dataBase||todayISO(), desc:'Saldo inicial ao criar o pote', tipo:'aporte', valor: Number(p.saldoBase||0), inicial:true }]
    .concat(movimentosDoPote(poteId).map(m=>({ data:m.data, desc: m.tipo==='aporte'?'Transferência da conta':'Resgate para a conta', tipo:m.tipo, valor:Number(m.valor||0) })));
  eventos.sort((a,b)=> a.data.localeCompare(b.data));
  let saldoAcum = 0;
  const linhas = eventos.map(ev=>{
    saldoAcum += ev.tipo==='aporte' ? ev.valor : -ev.valor;
    return { ...ev, saldoApos: saldoAcum };
  }).reverse(); // mais recente primeiro
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h3>Extrato · ${p.icone||'🐷'} ${p.nome}</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    ${linhas.length===0 ? `<div class="empty-state">Nenhuma movimentação ainda.</div>` :
    linhas.map(l=>`
      <div class="extrato-item" style="border-bottom:1px solid var(--gridline); padding:8px 0;">
        <span>${l.desc}<br><span class="hint">${fmtDate(l.data)} · saldo: ${fmtMoney(l.saldoApos)}</span></span>
        <span class="${l.tipo==='aporte'?'good':'crit'}">${l.tipo==='aporte'?'+':'−'}${fmtMoney(l.valor)}</span>
      </div>`).join('')}
  `);
}

function slugifyCategoria(label){
  let base = (label||'').trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'') // remove acentos
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  if(!base) base = 'categoria';
  let key = base, i = 2;
  const usados = new Set((state.categorias||[]).map(c=>c.key));
  while(usados.has(key)){ key = `${base}-${i}`; i++; }
  return key;
}

    ? `Excluir "${c.label}"? Os ${nLanc} lançamento${nLanc===1?'':'s'} dessa categoria serão movidos para "Outros".`
    : `Excluir a categoria "${c.label}"?`;
  if(!confirm(aviso)) return;

  state.lancamentos.forEach(l=>{ if(l.categoria===catKey) l.categoria='outros'; });

  if(ui.relCategoria===catKey) ui.relCategoria='todos';
  if(ui.simCategoria===catKey) ui.simCategoria=null;
  saveState();

function importarBackup(ev){
  const f = ev.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      if(!imported.lancamentos) throw new Error('formato inválido');
      const def = defaultState();
      state = { ...def, ...imported, settings: { ...def.settings, ...(imported.settings||{}) } };
      saveState();
      showToast('Backup importado ✓');
      renderConfig();
    }catch(e){ showToast('Arquivo inválido'); }
  };
  reader.readAsText(f);
}
function restaurarBackupAutomatico(){
  try{
    const raw = localStorage.getItem(LS_BACKUP_KEY);

    if(!confirm(`Restaurar o backup automático com ${((backup.lancamentos||[]).length)} lançamento(s)? Isso substitui os dados atuais deste aparelho.`)) return;
    const def = defaultState();
    state = { ...def, ...backup, settings: { ...def.settings, ...(backup.settings||{}) } };
    state.updatedAt = Date.now();

    showToast('Backup automático restaurado ✓');

}

/* =========================================================
   SINCRONIZAÇÃO (Firebase Firestore — opcional)
========================================================= */
/* =========================================================
   MERGE DE SINCRONIZAÇÃO (por ID, não "o array inteiro mais novo vence")
   ---------------------------------------------------------------------
   Antes: syncPush() mandava state.lancamentos inteiro; onSnapshot aceitava o
   array remoto inteiro se remote.updatedAt > state.updatedAt. Isso causa
   lançamentos "sumindo": se o Tiago lança algo no celular (push A) e a
   Luciana lança outra coisa quase ao mesmo tempo no notebook dela — cujo
   estado local ainda não tinha recebido o push A —, o push B da Luciana
   sobrescreve a nuvem com um array que não tem o lançamento do Tiago; o
   onSnapshot do celular do Tiago então aceita o array da Luciana (mais
   recente) por inteiro, e o lançamento dele desaparece — mesmo os dois
   aparelhos mostrando "Sincronizado" (e mostram mesmo: ambos convergem pro
   mesmo estado, só que um estado que perdeu uma entrada no meio do caminho).

   Uma tentativa de correção baseada em merge por id + lápides de exclusão foi
   testada e publicada em 2026-08-24 (v8), mas se mostrou instável em uso real
   (gerou exclusões fantasmas de lançamentos por causa de condição de corrida
   entre onSnapshot/syncPush/saveState) e foi revertida no mesmo dia para esta
   versão simples — que é a que está validada há semanas em produção. Ver
   memória do projeto (seção v8) para o diagnóstico completo antes de tentar
   de novo; a próxima tentativa precisa marcar exclusões no exato ponto onde o
   usuário exclui algo, nunca inferir por diff de array. */
async function connectFirebase(cfg){
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
  if(!fbApp){
    fbApp = firebase.initializeApp({
      apiKey: cfg.apiKey,
      authDomain: cfg.authDomain || (cfg.projectId+'.firebaseapp.com'),
      projectId: cfg.projectId,
      appId: cfg.appId,
    });
  }
  fbDb = firebase.firestore();
  const docRef = fbDb.collection('familias').doc(cfg.familyCode);
  if(fbUnsub) fbUnsub();
  // fbReady só vira true quando o primeiro snapshot de verdade chega (sucesso OU
  // erro) — nunca só por termos chamado onSnapshot(). Isso evita o selo
  // "Sincronizado" aparecer quando, na prática, o canal de tempo real nunca
  // conseguiu abrir (foi exatamente esse selo enganoso que escondeu o bug do
  // celular por tanto tempo).
  let primeiroSnapshotRecebido = false;
  fbUnsub = docRef.onSnapshot(snap=>{
    try{
      primeiroSnapshotRecebido = true;
      fbReady = true;
      if(!snap.exists){ renderAll(); return; }
      const remote = snap.data();
      if(!remote || !remote.updatedAt){ renderAll(); return; }
      const remoteLancamentos = remote.lancamentos || [];
      // Bug encontrado em 2026-08-25: comparar só por timestamp (updatedAt) é
      // perigoso, porque um saveState() local totalmente inofensivo (ex: gerar
      // as próximas ocorrências de uma recorrência indeterminada, chamado no
      // início do app antes mesmo do Firebase conectar) carimba state.updatedAt
      // com Date.now() — um horário "mais novo" que o do último sync real —
      // MESMO quando o conteúdo local está vazio/desatualizado (ex: aparelho
      // que teve o armazenamento limpo). Isso fazia o snapshot remoto, correto
      // e completo, ser descartado silenciosamente pela checagem de timestamp,
      // travando a sincronização pra sempre nesse aparelho (nada dava erro,
      // porque não era um erro — era a lógica de "mais recente vence" fazendo
      // exatamente o que foi programada pra fazer, só que com premissa errada).
      // Por isso: se o remoto tem MUITO mais lançamentos que o local, aceita o
      // remoto mesmo que o timestamp local pareça mais novo — quantidade de
      // dados reais importa mais que o relógio nesse caso.
      const remotoTemMuitoMaisDados = remoteLancamentos.length > 0 && remoteLancamentos.length > state.lancamentos.length + 5;
      if(remote.updatedAt <= state.updatedAt && !remotoTemMuitoMaisDados){ renderAll(); return; }
      if(remotoTemMuitoMaisDados && remote.updatedAt <= state.updatedAt){
        console.warn('Sync: aceitando snapshot remoto com timestamp mais antigo porque tem muito mais dados que o local (' + remoteLancamentos.length + ' vs ' + state.lancamentos.length + ') — provável estado local vazio/desatualizado.');
      }
      // Rede de segurança (v5.1): nunca aceitar cegamente um remoto que
      // apagaria TUDO que temos localmente — sinal de aparelho com
      // armazenamento vazio/corrompido tendo empurrado um estado vazio.
      if(state.lancamentos.length > 0 && remoteLancamentos.length === 0){
        console.warn('Sync: ignorando snapshot remoto vazio para não apagar lançamentos locais. Reenviando estado local.');
        syncPush().catch(e=>console.error('sync re-push', e));
        return;
      }
      state = {
        ...state,
        lancamentos: remote.lancamentos || [],
        potes: remote.potes || [],
        movimentosPoupanca: remote.movimentosPoupanca || [],
        categorias: (remote.categorias && remote.categorias.length) ? remote.categorias : state.categorias,
        cartoes: (remote.cartoes && remote.cartoes.length) ? remote.cartoes : state.cartoes,
        settings: { ...state.settings, ...(remote.settings||{}) },
        updatedAt: remote.updatedAt,
      };
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      rebuildCategoriesFromState();
      renderAll();
      showToast('Dados atualizados de outro aparelho ✓');
    }catch(e){
      console.error('onSnapshot handler error', e);
      mostrarErroDiagnostico('Erro ao aplicar dados recebidos: ' + e.message);
      renderAll();
    }
  }, err=>{
    primeiroSnapshotRecebido = true;
    fbReady = false;
    console.error(err);
    mostrarErroDiagnostico('Erro de sincronização (onSnapshot): ' + err.code + ' — ' + err.message);
    renderAll();
  });
  // Se depois de 15s nenhum snapshot (sucesso ou erro) chegou, o canal de tempo
  // real travou silenciosamente — mesma situação que o teste 4 da página de
  // diagnóstico mede com timeout de 12s. Avisa em vez de deixar o selo "Só
  // neste aparelho" sem explicação.
  setTimeout(()=>{
    if(!primeiroSnapshotRecebido){
      mostrarErroDiagnostico('A conexão de sincronização em tempo real não respondeu em 15s (nem sucesso, nem erro). O app vai continuar tentando, mas os dados deste aparelho podem estar desatualizados.');
      renderAll();
    }
  }, 15000);
  renderAll();
}
async function syncPush(){
  if(!fbDb || !state.settings.firebase) return;
  const cfg = state.settings.firebase;
  const docRef = fbDb.collection('familias').doc(cfg.familyCode);
  // Rede de segurança (v5.1): nunca escrever um array de lançamentos vazio
  // por cima de um documento remoto que já tem dados — sinal de que este
  // aparelho está com o armazenamento vazio/corrompido, não que a família
  // ficou sem lançamentos de verdade.
  if(state.lancamentos.length === 0){
    try{
      const snap = await docRef.get();
      if(snap.exists){
        const remote = snap.data();
        if(remote && (remote.lancamentos||[]).length > 0){
          console.warn('Sync: abortando push vazio por cima de dados bons na nuvem.');
          return;
        }
      }
    }catch(e){ console.error('sync pre-check', e); }
  }
  state.updatedAt = Date.now();
  await docRef.set({
    lancamentos: state.lancamentos,
    potes: state.potes,
    movimentosPoupanca: state.movimentosPoupanca,
    categorias: state.categorias,
    cartoes: state.cartoes,
    settings: { rendaFixa: state.settings.rendaFixa, orcamento: state.settings.orcamento, contaCorrente: state.settings.contaCorrente },
    updatedAt: state.updatedAt,
  }, { merge: true });
}
// Conecta ao Firebase na abertura do app. Se falhar (ex: script do Firebase não
// carregou por causa de rede instável no celular), tenta mais 2 vezes com um
// pequeno intervalo antes de desistir — e SEMPRE avisa visivelmente se não
// conseguir, em vez de deixar o app "sincronizado" na aparência mas sem
// conexão de verdade nos bastidores (bug do badge, ver renderSyncBadge).
async function conectarComRetentativa(cfg, tentativa=1){
  try{
    await connectFirebase(cfg);
  }catch(e){
    console.error('auto-sync tentativa ' + tentativa, e);
    if(tentativa < 3){
      setTimeout(()=>conectarComRetentativa(cfg, tentativa+1), 2000 * tentativa);
    }else{
      mostrarErroDiagnostico('Não consegui conectar à sincronização depois de 3 tentativas: ' + (e && e.message ? e.message : String(e)));
    }
  }
}
async function salvarConfigSync(){
  const apiKey = document.getElementById('fbApiKey').value.trim();
  const projectId = document.getElementById('fbProjectId').value.trim();
  const appId = document.getElementById('fbAppId').value.trim();
  const familyCode = document.getElementById('fbFamilyCode').value.trim();
  if(!apiKey||!projectId||!appId||!familyCode){ showToast('Preencha todos os campos de sincronização'); return; }
  const cfg = { apiKey, projectId, appId, familyCode };
  try{
    await connectFirebase(cfg);
    state.settings.firebase = cfg;
    saveState({ skipSync:true });
    await syncPush();
    showToast('Sincronização ativada ✓');
    renderConfig();
  }catch(e){ console.error(e); showToast('Não consegui conectar — confira os dados do Firebase'); }
}
function desconectarSync(){
  if(fbUnsub) fbUnsub();
  fbUnsub = null; fbReady = false;
  state.settings.firebase = null;
  saveState({ skipSync:true });
  showToast('Sincronização desativada neste aparelho');
  renderConfig();
}

/* =========================================================
   INIT
========================================================= */
(function init(){
  if(state.settings.theme && state.settings.theme!=='auto'){
    document.documentElement.setAttribute('data-theme', state.settings.theme);
  }
  if(state.settings.firebase){
    conectarComRetentativa(state.settings.firebase);
  }
  // Completa o horizonte de 12 meses de qualquer recorrência indeterminada
  // (ex: Netflix) que ainda não tenha lançamentos futuros suficientes gerados.
  if(completarHorizonteRecorrencias()){ saveState(); } else { renderAll(); }
})();

</script>
